<!doctype html>
<meta charset="utf-8">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Liberation Serif","Times New Roman",serif;color:#17150F;
    -webkit-font-smoothing:antialiased}
  .eyebrow{font-size:30px;letter-spacing:11px;color:#B4321F;text-transform:uppercase}
  .mono{font-family:"Liberation Mono",monospace}

  html,body{width:1200px;height:1200px;overflow:hidden}
  
  /* centred with a fixed gap — space-between strands the two halves at opposite edges */
  body{background:radial-gradient(ellipse at 34% 26%, #EDE9E1 0%, #DCD7CC 60%, #C9C3B6 100%);
    display:flex;flex-direction:column;align-items:center;
    justify-content:center;
    gap:56px;padding:78px 70px;
    text-align:center}
  .copy{max-width:none}
  .eyebrow{font-size:20px;letter-spacing:7px;color:#B4321F;
    text-transform:uppercase;white-space:nowrap}
  h1{margin-top:26px;font-size:74px;line-height:1.04;font-weight:700;
    letter-spacing:-2px;text-wrap:balance}
  .sub{margin-top:26px;font-size:29px;line-height:1.5;opacity:.74;
    max-width:none}
  /* height tracks the tallest card plus its offset, or the fan floats in dead space */
  .fan{position:relative;flex:0 0 auto;width:560px;
    height:397px}
  .fan img{position:absolute;top:0;width:300px;
    height:375px;object-fit:cover;border:1px solid rgba(0,0,0,.18);
    box-shadow:16px 22px 44px rgba(28,24,16,.28)}
  .f1{left:0;transform:rotate(-7deg)}
  .f2{left:130px;top:22px;z-index:2}
  .f3{left:260px;transform:rotate(6deg)}

</style>

<div class="copy">
  <div class="eyebrow">The Bureau of Minor Achievements</div>
  <h1>Official recognition for things that don't deserve any.</h1>
  <div class="sub">Personalized certificates, printed in the USA, delivered in 3–5 days.</div>
</div>
<div class="fan">
  <img class="f1" src="../out/bma-retirement.png">
  <img class="f2" src="../out/bma-uncle.png">
  <img class="f3" src="../out/bma-x-secret-santa.png">
</div>
