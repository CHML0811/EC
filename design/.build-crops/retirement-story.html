<!doctype html>
<meta charset="utf-8">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Liberation Serif","Times New Roman",serif;color:#17150F;

  .eyebrow{font-size:30px;letter-spacing:11px;color:#B4321F;text-transform:uppercase}

  html,body{width:1080px;height:1920px;overflow:hidden}
  
  body{background:radial-gradient(ellipse at 44% 26%, #EDE9E1 0%, #DCD7CC 58%, #C9C3B6 100%);

    justify-content:space-between;text-align:center}
  .eyebrow{font-size:23px;letter-spacing:8px}
  .art{display:block;width:720px;height:900px;object-fit:cover;

  .banner{width:100%;background:#B4321F;color:#FBFAF6;padding:34px 28px;
    font-size:54px;letter-spacing:3px;text-transform:uppercase;line-height:1.2;
    text-wrap:balance;box-shadow:10px 12px 26px rgba(28,24,16,.26)}
  .sub{font-size:29px;line-height:1.5;opacity:.78}

</style>

<div class="eyebrow">The Bureau of Minor Achievements</div>
