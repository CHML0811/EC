<!doctype html>
<meta charset="utf-8">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Liberation Serif","Times New Roman",serif;color:#17150F;
    -webkit-font-smoothing:antialiased}
  .eyebrow{font-size:30px;letter-spacing:11px;color:#B4321F;text-transform:uppercase}
  .mono{font-family:"Liberation Mono",monospace}

  html,body{width:1080px;height:1350px;overflow:hidden}
  
  body{background:#F2EFE4;padding:82px 76px;display:flex;gap:64px;align-items:center}
  .left{flex:0 0 400px}
  .art{display:block;width:400px;height:500px;object-fit:cover;
    box-shadow:16px 20px 40px rgba(28,24,16,.26);border:1px solid rgba(0,0,0,.16)}
  .right{flex:1;display:flex;flex-direction:column;justify-content:center;gap:26px}
  .eyebrow{font-size:19px;letter-spacing:6px;line-height:1.5}
  .title{font-size:66px;line-height:1.06;font-weight:700;text-transform:uppercase;
    letter-spacing:-1px;text-wrap:balance}
  .subject{font-size:27px;letter-spacing:9px;color:#565E42;text-transform:uppercase}
  .rule{width:150px;height:3px;background:#B4321F}
  .sub{font-size:26px;line-height:1.5;opacity:.72}

</style>

<div class="left"><img class="art" src="../out/bma-new-parent.png"></div>
<div class="right">
  <div class="eyebrow">The Bureau of<br>Minor Achievements</div>
  <div class="title">Certificate of Sustained Sleep Deprivation</div>
  <div class="subject">PARENTHOOD</div>
  <div class="rule"></div>
  <div class="sub">Personalized with any name.<br>Printed in the USA.</div>
</div>
